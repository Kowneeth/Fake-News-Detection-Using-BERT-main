version: "3.8"

services:
  fake-news-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fake-news-detection-api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - MODEL_PATH=/app/outputs/saved_weights.pt
    restart: unless-stopped
    volumes:
      - ./outputs:/app/outputs
